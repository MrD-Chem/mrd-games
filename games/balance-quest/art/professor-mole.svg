  <rect x="53.5" y="84" width="13" height="3.5" rx="1.75" fill="#94a3b8"/>
  <!-- paws with digging claws -->
  <ellipse cx="48" cy="106" rx="6.5" ry="5.2" fill="#f9a8d4"/>
  <ellipse cx="72" cy="106" rx="6.5" ry="5.2" fill="#f9a8d4"/>
  <path d="M51.5 103.2h2.6M52.3 106h2.6M51.5 108.8h2.6M68.5 103.2h-2.6M67.7 106h-2.6M68.5 108.8h-2.6" stroke="#fdf2f8" stroke-width="1.5" stroke-linecap="round"/>
