<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Mole Rush — Maps 2–4 demo</title>
  <link rel="icon" href="../../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../../assets/site.css?v=20261022T1604">
  <link rel="stylesheet" href="../style.css?v=20261022T1604">
  <link rel="stylesheet" href="../css/maps.css?v=20261022T1604">
  <link rel="stylesheet" href="demo.css?v=20261022T1604">
  <script src="../data/bank.js?v=20261022T1604" defer></script>
  <script type="module" src="demo.js?v=20261022T1604"></script>
</head>
<body class="page-game mr-page">
  <main class="wrap mr-main mr-demo">
    <h1>Mole Rush — Maps 2–4</h1>
    <p>Choose a map and a problem to try it. The self-test checks every problem on all three maps.</p>
    <div class="panel mr-demo-controls">
      <label>Map <select id="demo-map"></select></label>
      <label>Problem <select id="demo-problem"></select></label>
      <button type="button" class="btn btn-ghost" id="demo-reset">Restart problem</button>
      <button type="button" class="btn btn-primary" id="demo-test">Run self-test</button>
    </div>
    <p id="demo-test-result" role="status"></p>
    <ul id="demo-failures" hidden></ul>
    <div id="demo-stage" class="mr-stage"></div>
    <p id="demo-result" role="status"></p>
    <div id="demo-test-host" hidden></div>
    <p class="sr-only" id="mr-announce" aria-live="polite"></p>
    <noscript><p>This demo needs JavaScript turned on.</p></noscript>
  </main>
</body>
</html>
