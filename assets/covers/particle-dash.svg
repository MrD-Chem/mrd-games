<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <title>A speeding atom with protons, neutrons and electrons</title>
  <defs>
    <linearGradient id="pd-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1530"/><stop offset="1" stop-color="#070a13"/></linearGradient>
    <radialGradient id="pd-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f472b6" stop-opacity="0.5"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="pd-eg" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#5eead4" stop-opacity="0.8"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
    <linearGradient id="pd-streak" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></linearGradient>
    <path id="pd-sp" d="M0-6 1.8-1.8 6 0 1.8 1.8 0 6-1.8 1.8-6 0-1.8-1.8z"/>
  </defs>
  <rect width="320" height="180" fill="url(#pd-bg)"/>
  <ellipse cx="170" cy="90" rx="120" ry="90" fill="url(#pd-glow)"/>
  <!-- motion streaks -->
  <g stroke="url(#pd-streak)" stroke-width="4" stroke-linecap="round">
    <path d="M10 62H96M0 90H76M20 118H92M40 140H100M44 40H104"/>
  </g>
  <!-- orbits -->
  <g fill="none" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.9">
    <ellipse cx="170" cy="90" rx="70" ry="24" transform="rotate(-30 170 90)"/>
    <ellipse cx="170" cy="90" rx="70" ry="24" transform="rotate(30 170 90)"/>
  </g>
  <!-- electrons -->
  <g>
    <circle cx="231" cy="64" r="16" fill="url(#pd-eg)"/><circle cx="109" cy="116" r="16" fill="url(#pd-eg)"/>
    <circle cx="228" cy="110" r="16" fill="url(#pd-eg)"/><circle cx="111" cy="70" r="16" fill="url(#pd-eg)"/>
    <g fill="#2dd4bf" stroke="#ccfbf1" stroke-width="2">
      <circle cx="231" cy="64" r="8"/><circle cx="109" cy="116" r="8"/><circle cx="228" cy="110" r="8"/><circle cx="111" cy="70" r="8"/>
    </g>
    <g stroke="#0d1326" stroke-width="2.500" stroke-linecap="round"><path d="M227 64h8M105 116h8M224 110h8M107 70h8"/></g>
  </g>
  <!-- nucleus -->
  <g>
    <circle cx="170" cy="90" r="30" fill="#f472b6" fill-opacity="0.25"/>
    <g fill="#94a3b8"><circle cx="176.500" cy="101" r="10.500"/><circle cx="157" cy="90" r="10.500"/><circle cx="176.500" cy="79" r="10.500"/></g>
    <g fill="#f472b6"><circle cx="183" cy="90" r="10.500"/><circle cx="163.500" cy="101" r="10.500"/><circle cx="163.500" cy="79" r="10.500"/></g>
    <g stroke="#fff" stroke-width="2.500" stroke-linecap="round">
      <path d="M183 85v10M178 90h10M163.500 96v10M158.500 101h10M163.500 74v10M158.500 79h10"/>
    </g>
    <g fill="#cbd5e1"><circle cx="174" cy="98" r="2"/><circle cx="154" cy="87" r="2"/><circle cx="174" cy="76" r="2"/></g>
  </g>
  <!-- flame -->
  <path d="M112 150q-8-10 0-22 2 8 8 10 0-8 6-14 2 14 8 22 4 12-10 16-12-2-12-12z" fill="#fbbf24" transform="translate(54 20) scale(0.85)"/>
  <path d="M120 160q-4-6 0-12 1 4 4 6 0-4 3-6 1 8 4 12 0 5-5 6-6-1-6-6z" fill="#fb7185" transform="translate(54 20) scale(0.85)"/>
  <g fill="#fde68a"><use href="#pd-sp" transform="translate(40 26)"/><use href="#pd-sp" transform="translate(286 34) scale(0.8)"/><use href="#pd-sp" transform="translate(282 150) scale(0.6)"/></g>
</svg>
