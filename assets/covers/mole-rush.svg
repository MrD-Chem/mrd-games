<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <title>Professor Mole racing a kart toward the finish line</title>
  <defs>
    <linearGradient id="mr-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2a3a"/><stop offset="1" stop-color="#070a13"/></linearGradient>
    <radialGradient id="mr-glow" cx="0.5" cy="0.3" r="0.6"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.45"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <linearGradient id="mr-road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3a55"/><stop offset="1" stop-color="#141a33"/></linearGradient>
    <linearGradient id="mr-fade" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#99f6e4"/><stop offset="1" stop-color="#99f6e4" stop-opacity="0"/></linearGradient>
    <path id="mr-sp" d="M0-6 1.8-1.8 6 0 1.8 1.8 0 6-1.8 1.8-6 0-1.8-1.8z"/>
  </defs>
  <rect width="320" height="180" fill="url(#mr-bg)"/>
  <rect width="320" height="180" fill="url(#mr-glow)"/>
  <!-- road curving toward viewer -->
  <path d="M184 44Q176 108 62 180H238Q204 108 200 44z" fill="url(#mr-road)"/>
  <path d="M184 44Q176 108 62 180M200 44Q204 108 238 180" fill="none" stroke="#2dd4bf" stroke-width="4"/>
  <path d="M184 44Q176 108 62 180M200 44Q204 108 238 180" fill="none" stroke="#f1f5f9" stroke-width="4" stroke-dasharray="7 9"/>
  <path d="M192 46Q190 108 150 180" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 8" stroke-linecap="round"/>
  <!-- finish banner -->
  <g>
    <rect x="178" y="22" width="3.5" height="26" fill="#cbd5e1"/><rect x="202" y="22" width="3.5" height="26" fill="#cbd5e1"/>
    <rect x="178" y="22" width="28" height="12" fill="#f1f5f9"/>
    <g fill="#0d1326"><rect x="178" y="22" width="5.6" height="6"/><rect x="189.2" y="22" width="5.6" height="6"/><rect x="200.4" y="22" width="5.6" height="6"/><rect x="183.6" y="28" width="5.6" height="6"/><rect x="194.8" y="28" width="5.6" height="6"/></g>
  </g>
  <!-- speed lines -->
  <g stroke-linecap="round" stroke-width="3.5">
    <path d="M60 78h34M74 98h38M52 124h44M80 142h30" stroke="#99f6e4" stroke-opacity="0.7"/>
    <path d="M250 88h-26M262 110h-34M244 130h-28" stroke="#5eead4" stroke-opacity="0.6"/>
  </g>
  <!-- kart -->
  <ellipse cx="152" cy="156" rx="40" ry="6" fill="#000" opacity="0.35"/>
  <rect x="106" y="134" width="14" height="22" rx="5" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <rect x="184" y="134" width="14" height="22" rx="5" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <path d="M116 124h72q8 0 8 9v8q0 6-8 6h-72q-8 0-8-6v-8q0-9 8-9z" fill="#2dd4bf"/>
  <path d="M118 134h68" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"/>
  <path d="M120 126h64q4 0 5 3H115q1-3 5-3z" fill="#99f6e4"/>
  <circle cx="152" cy="149" r="5" fill="#fbbf24"/>
  <!-- Professor Mole head -->
  <ellipse cx="152" cy="98" rx="31" ry="28" fill="#8b6a52"/>
  <path d="M143 71q9-9 18 0" fill="none" stroke="#6b4f3c" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="152" cy="116" rx="15" ry="10" fill="#b08b6e"/>
  <ellipse cx="152" cy="111" rx="7.5" ry="5.5" fill="#f472b6"/>
  <ellipse cx="150" cy="109.500" rx="2.200" ry="1.400" fill="#fbcfe8"/>
  <path d="M144 120q8 6 16 0" fill="none" stroke="#3b2a1f" stroke-width="2.500" stroke-linecap="round"/>
  <ellipse cx="129" cy="110" rx="5" ry="3" fill="#f9a8d4" opacity="0.55"/><ellipse cx="175" cy="110" rx="5" ry="3" fill="#f9a8d4" opacity="0.55"/>
  <path d="M121 93h62" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <circle cx="139" cy="93" r="11" fill="#99f6e4" stroke="#334155" stroke-width="4"/><circle cx="165" cy="93" r="11" fill="#99f6e4" stroke="#334155" stroke-width="4"/>
  <circle cx="141" cy="94" r="3.600" fill="#1e293b"/><circle cx="167" cy="94" r="3.600" fill="#1e293b"/>
  <circle cx="135.500" cy="89" r="2.600" fill="#fff" opacity="0.85"/><circle cx="161.500" cy="89" r="2.600" fill="#fff" opacity="0.85"/>
  <!-- paws on wheel -->
  <ellipse cx="130" cy="130" rx="6" ry="5" fill="#f9a8d4"/><ellipse cx="174" cy="130" rx="6" ry="5" fill="#f9a8d4"/>
  <g fill="#fde68a"><use href="#mr-sp" transform="translate(36 40)"/><use href="#mr-sp" transform="translate(286 70) scale(0.8)"/><use href="#mr-sp" transform="translate(284 150) scale(0.6)"/></g>
  <g fill="#99f6e4"><circle cx="24" cy="110" r="1.5"/><circle cx="298" cy="30" r="1.5"/><circle cx="50" cy="160" r="1.3"/></g>
</svg>
