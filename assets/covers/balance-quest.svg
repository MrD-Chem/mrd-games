<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <title>A level balance scale in front of a glowing doorway</title>
  <defs>
    <linearGradient id="bq-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1840"/><stop offset="1" stop-color="#070a13"/></linearGradient>
    <radialGradient id="bq-glow" cx="0.5" cy="0.55" r="0.5"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.65"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <linearGradient id="bq-door" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4b5fd" stop-opacity="0.55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0.15"/></linearGradient>
    <path id="bq-sp" d="M0-6 1.8-1.8 6 0 1.8 1.8 0 6-1.8 1.8-6 0-1.8-1.8z"/>
  </defs>
  <rect width="320" height="180" fill="url(#bq-bg)"/>
  <ellipse cx="160" cy="100" rx="130" ry="95" fill="url(#bq-glow)"/>
  <!-- faint grid in the outer margins -->
  <g stroke="#a78bfa" stroke-opacity="0.12" stroke-width="1">
    <path d="M10 0v180M30 0v180M50 0v180M270 0v180M290 0v180M310 0v180M0 30h60M0 70h60M0 110h60M0 150h60M260 30h60M260 70h60M260 110h60M260 150h60"/>
  </g>
  <!-- doorway -->
  <path d="M108 160V84a52 52 0 0 1 104 0v76z" fill="url(#bq-door)" stroke="#c4b5fd" stroke-width="2.5" stroke-opacity="0.8"/>
  <path d="M122 160V86a38 38 0 0 1 76 0v74z" fill="#f5f3ff" fill-opacity="0.12"/>
  <!-- floor -->
  <path d="M60 160h200" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
  <!-- stand -->
  <path d="M160 58V150" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
  <rect x="134" y="148" width="52" height="12" rx="6" fill="#a78bfa"/>
  <!-- strings -->
  <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
    <path d="M100 60 72 114M100 60 128 114M220 60 192 114M220 60 248 114"/>
  </g>
  <!-- beam -->
  <rect x="88" y="54" width="144" height="9" rx="4.5" fill="#f1f5f9"/>
  <circle cx="160" cy="58" r="9" fill="#fbbf24"/><circle cx="157" cy="55" r="2.5" fill="#fde68a"/>
  <circle cx="100" cy="58.5" r="3.5" fill="#a78bfa"/><circle cx="220" cy="58.5" r="3.5" fill="#a78bfa"/>
  <!-- pans -->
  <path d="M70 113h60q-3 18-30 18t-30-18z" fill="#c4b5fd"/>
  <path d="M190 113h60q-3 18-30 18t-30-18z" fill="#c4b5fd"/>
  <rect x="68" y="110" width="64" height="5" rx="2.5" fill="#ede9fe"/>
  <rect x="188" y="110" width="64" height="5" rx="2.5" fill="#ede9fe"/>
  <!-- left: 2 H2 + O2 -->
  <g stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round">
    <path d="M79 104h7M118 104h7M94 104h9"/>
  </g>
  <circle cx="79" cy="104" r="4.5" fill="#f1f5f9"/><circle cx="86" cy="104" r="4.5" fill="#f1f5f9"/>
  <circle cx="118" cy="104" r="4.5" fill="#f1f5f9"/><circle cx="125" cy="104" r="4.5" fill="#f1f5f9"/>
  <circle cx="95" cy="103" r="6.5" fill="#fb7185"/><circle cx="103" cy="103" r="6.5" fill="#fb7185"/>
  <circle cx="93" cy="101" r="1.8" fill="#fecdd3"/><circle cx="101" cy="101" r="1.8" fill="#fecdd3"/>
  <!-- right: 2 H2O -->
  <g stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round">
    <path d="M212 96l-7 8M212 96l7 8M236 96l-7 8M236 96l7 8"/>
  </g>
  <circle cx="205" cy="104" r="4.5" fill="#f1f5f9"/><circle cx="219" cy="104" r="4.5" fill="#f1f5f9"/>
  <circle cx="229" cy="104" r="4.5" fill="#f1f5f9"/><circle cx="243" cy="104" r="4.5" fill="#f1f5f9"/>
  <circle cx="212" cy="95" r="7" fill="#fb7185"/><circle cx="236" cy="95" r="7" fill="#fb7185"/>
  <circle cx="210" cy="93" r="2" fill="#fecdd3"/><circle cx="234" cy="93" r="2" fill="#fecdd3"/>
  <!-- sparkles -->
  <g fill="#fde68a"><use href="#bq-sp" transform="translate(40 34)"/><use href="#bq-sp" transform="translate(284 52) scale(0.8)"/><use href="#bq-sp" transform="translate(270 140) scale(0.6)"/><use href="#bq-sp" transform="translate(30 128) scale(0.7)"/></g>
  <g fill="#ddd6fe"><circle cx="20" cy="80" r="1.5"/><circle cx="300" cy="100" r="1.5"/><circle cx="58" cy="12" r="1.3"/><circle cx="256" cy="16" r="1.3"/></g>
</svg>
