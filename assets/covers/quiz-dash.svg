<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <title>A runner jumping a hurdle across three lanes</title>
  <defs>
    <linearGradient id="qd-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2012"/><stop offset="1" stop-color="#070a13"/></linearGradient>
    <radialGradient id="qd-glow" cx="0.45" cy="0.45" r="0.55"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.4"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <path id="qd-sp" d="M0-6 1.8-1.8 6 0 1.8 1.8 0 6-1.8 1.8-6 0-1.8-1.8z"/>
  </defs>
  <rect width="320" height="180" fill="url(#qd-bg)"/>
  <rect width="320" height="180" fill="url(#qd-glow)"/>
  <!-- three lanes -->
  <rect x="0" y="30" width="320" height="40" fill="#1a2140"/>
  <rect x="0" y="70" width="320" height="40" fill="#232b52"/>
  <rect x="0" y="110" width="320" height="40" fill="#1a2140"/>
  <path d="M0 30H320M0 150H320" stroke="#fbbf24" stroke-width="3"/>
  <path d="M0 70H320M0 110H320" stroke="#f1f5f9" stroke-opacity="0.6" stroke-width="2.500" stroke-dasharray="10 8"/>
  <!-- hurdle -->
  <ellipse cx="190" cy="110" rx="26" ry="4" fill="#000" opacity="0.3"/>
  <path d="M176 92v18M204 92v18" stroke="#cbd5e1" stroke-width="4.500" stroke-linecap="round"/>
  <path d="M170 92h40" stroke="#f472b6" stroke-width="7" stroke-linecap="round"/>
  <path d="M180 92h6M194 92h6" stroke="#fbcfe8" stroke-width="7"/>
  <!-- speed lines -->
  <path d="M74 50h24M70 66h20M82 84h18" stroke="#fde68a" stroke-opacity="0.75" stroke-width="3.500" stroke-linecap="round"/>
  <!-- runner -->
  <ellipse cx="134" cy="109" rx="14" ry="3.500" fill="#000" opacity="0.3"/>
  <g stroke="#fbbf24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M138 62 128 86"/>
    <path d="M128 86l22 0 22-6"/>
    <path d="M128 86l-14 12-16-4"/>
    <path d="M134 68l16 4 8-8"/>
    <path d="M134 68l-14 2-8-12"/>
  </g>
  <circle cx="144" cy="48" r="11" fill="#fbbf24"/>
  <circle cx="141" cy="45" r="3" fill="#fde68a"/>
  <!-- beaker pickup (top lane) -->
  <circle cx="226" cy="50" r="17" fill="#fbbf24" fill-opacity="0.18"/>
  <path d="M218 40h16M220 40v8l-6 14q-1 3 2 3h20q3 0 2-3l-6-14v-8" fill="#e0f2fe" fill-opacity="0.25" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M217 56h18l4 8q1 2-2 2h-22q-3 0-2-2z" fill="#2dd4bf"/>
  <circle cx="228" cy="60" r="1.800" fill="#ccfbf1"/>
  <!-- ruler pickup (bottom lane) -->
  <circle cx="228" cy="130" r="19" fill="#fbbf24" fill-opacity="0.18"/>
  <rect x="208" y="123" width="40" height="14" rx="3" fill="#fde68a" transform="rotate(-12 228 130)"/>
  <g stroke="#7c5a10" stroke-width="2" stroke-linecap="round" transform="rotate(-12 228 130)"><path d="M214 123v6M221 123v4M228 123v6M235 123v4M242 123v6"/></g>
  <g fill="#fde68a"><use href="#qd-sp" transform="translate(40 24)"/><use href="#qd-sp" transform="translate(284 20) scale(0.8)"/><use href="#qd-sp" transform="translate(280 168) scale(0.6)"/><use href="#qd-sp" transform="translate(30 166) scale(0.7)"/></g>
</svg>
