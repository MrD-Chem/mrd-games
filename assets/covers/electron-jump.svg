<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <title>An electron dropping to a lower energy level and releasing a photon</title>
  <defs>
    <linearGradient id="ej-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1540"/><stop offset="1" stop-color="#070a13"/></linearGradient>
    <radialGradient id="ej-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.5"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="ej-eg" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#5eead4" stop-opacity="0.85"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
    <radialGradient id="ej-ng" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#fbcfe8"/><stop offset="0.35" stop-color="#f472b6"/><stop offset="1" stop-color="#be185d"/></radialGradient>
    <linearGradient id="ej-ph" gradientUnits="userSpaceOnUse" x1="190" y1="0" x2="252" y2="0"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <path id="ej-sp" d="M0-6 1.8-1.8 6 0 1.8 1.8 0 6-1.8 1.8-6 0-1.8-1.8z"/>
  </defs>
  <rect width="320" height="180" fill="url(#ej-bg)"/>
  <ellipse cx="150" cy="90" rx="130" ry="90" fill="url(#ej-glow)"/>
  <!-- energy levels -->
  <g fill="none" stroke="#c4b5fd" stroke-width="3">
    <circle cx="128" cy="90" r="22" stroke-opacity="0.95"/>
    <circle cx="128" cy="90" r="42" stroke-opacity="0.75"/>
    <circle cx="128" cy="90" r="62" stroke-opacity="0.55"/>
  </g>
  <!-- nucleus -->
  <circle cx="128" cy="90" r="13" fill="url(#ej-ng)"/>
  <path d="M128 85v10M123 90h10" stroke="#fff" stroke-width="2.500" stroke-linecap="round"/>
  <!-- ghost start -->
  <circle cx="159" cy="36" r="8" fill="none" stroke="#5eead4" stroke-width="2" stroke-dasharray="3 3" stroke-opacity="0.8"/>
  <!-- drop arrow -->
  <path d="M164 46Q181 54 172 68" fill="none" stroke="#f1f5f9" stroke-width="2.500" stroke-dasharray="5 5" stroke-linecap="round"/>
  <path d="M165 63 172 71 178 62" fill="none" stroke="#f1f5f9" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- electron -->
  <circle cx="168" cy="86" r="17" fill="url(#ej-eg)"/>
  <circle cx="168" cy="86" r="8.500" fill="#2dd4bf" stroke="#ccfbf1" stroke-width="2"/>
  <path d="M164 86h8" stroke="#0d1326" stroke-width="2.500" stroke-linecap="round"/>
  <!-- photon -->
  <use href="#ej-sp" transform="translate(194 84) scale(1.500)" fill="#fde68a"/>
  <path d="M202 84q6-14 12 0t12 0 12 0 12 0" fill="none" stroke="url(#ej-ph)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M250 76 260 84 250 92z" fill="#fbbf24"/>
  <g fill="#fde68a"><use href="#ej-sp" transform="translate(40 34)"/><use href="#ej-sp" transform="translate(288 34) scale(0.8)"/><use href="#ej-sp" transform="translate(284 150) scale(0.6)"/><use href="#ej-sp" transform="translate(34 142) scale(0.7)"/></g>
  <g fill="#ddd6fe"><circle cx="20" cy="80" r="1.500"/><circle cx="302" cy="104" r="1.500"/><circle cx="62" cy="12" r="1.300"/></g>
</svg>
