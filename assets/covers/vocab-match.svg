<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <title>Two flash cards, an atom symbol matched to its definition lines with a green check</title>
  <defs>
    <linearGradient id="vm-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10303a"/><stop offset="1" stop-color="#070a13"/></linearGradient>
    <radialGradient id="vm-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <linearGradient id="vm-am" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <path id="vm-sp" d="M0-6 1.8-1.8 6 0 1.8 1.8 0 6-1.8 1.8-6 0-1.8-1.8z"/>
  </defs>
  <rect width="320" height="180" fill="url(#vm-bg)"/>
  <ellipse cx="160" cy="90" rx="130" ry="85" fill="url(#vm-glow)"/>
  <!-- connector -->
  <path d="M122 134Q160 164 202 114" fill="none" stroke="#5eead4" stroke-width="2.500" stroke-linecap="round" stroke-dasharray="1 6"/>
  <path d="M122 134Q160 164 202 114" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>
  <!-- back card -->
  <g transform="rotate(6 200 80)">
    <rect x="154" y="48" width="92" height="64" rx="9" fill="#f1f5f9"/>
    <rect x="154" y="48" width="92" height="12" rx="6" fill="#2dd4bf"/>
    <rect x="154" y="54" width="92" height="6" fill="#2dd4bf"/>
    <rect x="166" y="70" width="60" height="6" rx="3" fill="#94a3b8"/>
    <rect x="166" y="82" width="46" height="6" rx="3" fill="#94a3b8"/>
    <rect x="166" y="94" width="54" height="6" rx="3" fill="#94a3b8"/>
    <circle cx="202" cy="112" r="5.500" fill="#fff" stroke="#5eead4" stroke-width="2.500"/>
    <circle cx="246" cy="48" r="13" fill="#22c55e" stroke="#bbf7d0" stroke-width="2.500"/>
    <path d="M240 48.500 245 53.500 253 43" fill="none" stroke="#fff" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- front card -->
  <g transform="rotate(-6 120 100)">
    <rect x="76" y="66" width="92" height="68" rx="9" fill="#000" opacity="0.3" transform="translate(3 5)"/>
    <rect x="74" y="66" width="92" height="68" rx="9" fill="url(#vm-am)"/>
    <rect x="80" y="70" width="3.500" height="56" rx="1.700" fill="#fff" fill-opacity="0.35"/>
    <g transform="translate(120 100)">
      <circle r="25" fill="none" stroke="#0d1326" stroke-width="3"/>
      <circle r="10" fill="#0d1326"/><circle cx="-3" cy="-3" r="2.600" fill="#fde68a"/>
      <circle cx="-18" cy="-17" r="5" fill="#0d1326"/><circle cx="25" cy="0" r="5" fill="#0d1326"/><circle cx="-12" cy="22" r="5" fill="#0d1326"/>
    </g>
    <circle cx="122" cy="134" r="5.500" fill="#fff" stroke="#0d1326" stroke-width="2.500"/>
  </g>
  <g fill="#fde68a"><use href="#vm-sp" transform="translate(40 34)"/><use href="#vm-sp" transform="translate(288 120) scale(0.8)"/><use href="#vm-sp" transform="translate(282 152) scale(0.6)"/><use href="#vm-sp" transform="translate(34 140) scale(0.7)"/></g>
  <g fill="#99f6e4"><circle cx="20" cy="80" r="1.500"/><circle cx="300" cy="70" r="1.500"/><circle cx="62" cy="12" r="1.300"/></g>
</svg>
