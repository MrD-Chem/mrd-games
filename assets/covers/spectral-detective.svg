<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <title>A magnifying glass enlarging the bright lines of a star's spectrum</title>
  <defs>
    <linearGradient id="sd-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141a33"/><stop offset="1" stop-color="#070a13"/></linearGradient>
    <radialGradient id="sd-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.4"/><stop offset="0.6" stop-color="#2dd4bf" stop-opacity="0.12"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <linearGradient id="sd-rb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="0.25" stop-color="#38bdf8"/><stop offset="0.5" stop-color="#4ade80"/><stop offset="0.75" stop-color="#fbbf24"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <clipPath id="sd-clip"><circle cx="150" cy="89" r="38"/></clipPath>
    <path id="sd-sp" d="M0-6 1.8-1.8 6 0 1.8 1.8 0 6-1.8 1.8-6 0-1.8-1.8z"/>
  </defs>
  <rect width="320" height="180" fill="url(#sd-bg)"/>
  <ellipse cx="160" cy="90" rx="130" ry="85" fill="url(#sd-glow)"/>
  <!-- star + fingerprint hint -->
  <g fill="none" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.35" stroke-linecap="round">
    <path d="M214 44a14 14 0 0 1 28 0M208 44a20 20 0 0 1 40 0M220 44a8 8 0 0 1 16 0"/>
  </g>
  <use href="#sd-sp" transform="translate(228 36) scale(2.800)" fill="#fde68a" fill-opacity="0.55"/>
  <!-- spectrum strip -->
  <rect x="70" y="67" width="180" height="44" rx="8" fill="#02030a" stroke="#475569" stroke-width="2.500"/>
  <rect x="74" y="60" width="172" height="3.500" rx="1.700" fill="url(#sd-rb)" opacity="0.8"/>
  <g stroke-width="4" stroke-linecap="butt">
    <path d="M96 71V107" stroke="#a78bfa"/><path d="M132 71V107" stroke="#2dd4bf"/><path d="M158 71V107" stroke="#f87171"/><path d="M171 71V107" stroke="#fb923c"/>
  </g>
  <!-- magnified view -->
  <g clip-path="url(#sd-clip)">
    <rect x="110" y="50" width="80" height="80" fill="#02030a"/>
    <g transform="translate(150 89) scale(1.300) translate(-150 -89)">
      <g stroke-width="4" stroke-linecap="butt">
        <path d="M132 60V118" stroke="#2dd4bf"/><path d="M158 60V118" stroke="#f87171"/><path d="M171 60V118" stroke="#fb923c"/>
      </g>
    </g>
    <path d="M122 72A38 38 0 0 1 148 53" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
  </g>
  <circle cx="150" cy="89" r="38" fill="#a78bfa" fill-opacity="0.08"/>
  <circle cx="150" cy="89" r="38" fill="none" stroke="#e2e8f0" stroke-width="6"/>
  <path d="M177 116 216 152" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>
  <path d="M179 118 190 128" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>
  <g fill="#fde68a"><use href="#sd-sp" transform="translate(40 34)"/><use href="#sd-sp" transform="translate(286 66) scale(0.8)"/><use href="#sd-sp" transform="translate(282 152) scale(0.6)"/><use href="#sd-sp" transform="translate(34 140) scale(0.7)"/></g>
  <g fill="#c4b5fd"><circle cx="20" cy="90" r="1.500"/><circle cx="302" cy="110" r="1.500"/><circle cx="62" cy="12" r="1.300"/></g>
</svg>
